# Release build of the server. SixLabors.ImageSharp 3.2.0 validates a Six Labors license at build time and fails
# Release builds without one, so the key (a free community key scoped to Zapara.Server.Social and
# Zapara.Server.Tests) comes from the repository secret SIXLABORS_LICENSE_KEY
# (Settings → Secrets and variables → Actions). The key is never written to the log or the repository.
name: server-release

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or pull request; a newer push cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # Self-hosted Linux runner of the owner. The repo is public: never run code from fork pull requests on it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          clean: true
          persist-credentials: false

      # The runner user cannot write the default /usr/share/dotnet (#160). As in tests.yml (#143), .NET goes into the
      # runner's tool cache (a stable path, not RUNNER_TEMP), so a runner downloads each SDK once: install-dotnet skips
      # a version that is already there. Same directory as tests.yml (zapara-dotnet-8, .NET 8 only); a runner runs one
      # job at a time. The runner context is not available in job-level env, so the install dir is set on each step;
      # setup-dotnet exports DOTNET_ROOT and PATH for the rest.
      # A directory without .complete is left over from an interrupted install (job cancelled or timed out mid-extract):
      # drop it, and drop the marker until this job's setup succeeds again.
      - name: Drop an unfinished .NET install
        run: |
          d="${RUNNER_TOOL_CACHE:?}/zapara-dotnet-8"
          [ -f "$d/.complete" ] || rm -rf "$d"
          rm -f "$d/.complete"

      # A hung download (seen for 45 min on one runner) stops after 5 min and is retried once from a clean directory.
      - id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        timeout-minutes: 5
        continue-on-error: true
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/zapara-dotnet-8
        with:
          dotnet-version: 8.0.x

      - name: Retry .NET setup from a clean directory
        if: steps.dotnet.outcome == 'failure'
        run: rm -rf "${RUNNER_TOOL_CACHE:?}/zapara-dotnet-8"

      - if: steps.dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        timeout-minutes: 5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/zapara-dotnet-8
        with:
          dotnet-version: 8.0.x

      - name: Mark the .NET install complete
        run: touch "${RUNNER_TOOL_CACHE:?}/zapara-dotnet-8/.complete"

      - name: Image upload tests (Debug, no license needed)
        run: |
          dotnet build src/Zapara.Server.Tests -c Debug
          dotnet src/Zapara.Server.Tests/bin/Debug/net8.0/Zapara.Server.Tests.dll \
            -method "Zapara.Server.Tests.AvatarTests.*" -method "Zapara.Server.Tests.AvatarHttpTests.*" \
            -method "Zapara.Server.Tests.SocialMediaTests.Photo_*" \
            -method "Zapara.Server.Tests.SocialMediaTests.Animated_png_is_reduced_to_its_first_frame" \
            -method "Zapara.Server.Tests.SocialMediaTests.Tiff_named_as_jpeg_is_rejected_by_content" \
            -method "Zapara.Server.Tests.SocialMediaTests.Decode_gate_limits_concurrent_decodes_and_reports_busy"

      # The license secret is used only for push and workflow_dispatch: pull request runs on the self-hosted
      # runner never receive it and do only the Debug build and tests above.
      - name: Check license secret
        id: license
        if: github.event_name != 'pull_request'
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          # Only push and workflow_dispatch reach this step, so a missing key is a configuration error.
          if [ -n "$SIXLABORS_LICENSE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::Repository secret SIXLABORS_LICENSE_KEY is not set; Release builds of the server need it."
            exit 1
          fi

      - name: Publish server (Release)
        if: github.event_name != 'pull_request' && steps.license.outputs.present == 'true'
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: dotnet publish src/Zapara.Server -c Release -o "$RUNNER_TEMP/server"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request' && steps.license.outputs.present == 'true'
        with:
          name: zapara-server
          path: ${{ runner.temp }}/server
          retention-days: 7

      # Persistent runner: remove build output and the published server from the workspace and temp dir.
      - name: Clean up
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/server"
          git clean -ffdx
