x-log: &log
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    <<: *log
    environment:
      POSTGRES_USER: zapara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zapara
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "log_statement=none"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zapara -d zapara"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 280m

  migrate:
    build: .
    <<: *log
    env_file: .env
    profiles: ["ops"]
    user: "0:0"
    entrypoint: ["/opt/zapara/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build: .
    <<: *log
    env_file: .env
    profiles: ["ops"]
    user: "0:0"
    entrypoint: ["/opt/zapara/seed.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build: .
    <<: *log
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Social__MediaRoot: /var/lib/zapara/media
    user: "0:0"
    volumes:
      - keys:/var/lib/zapara/keys
      - media:/var/lib/zapara/media
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped
    mem_limit: 420m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12

  admin:
    build: ./admin-panel
    <<: *log
    env_file: ./admin.env
    expose:
      - "80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 3s
      retries: 12

  caddy:
    image: caddy:2-alpine
    <<: *log
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    restart: unless-stopped
    mem_limit: 80m

  # Inbound mail only. Submission and IMAP stay on the compose network for webmail.
  maddy:
    image: foxcpp/maddy:0.7.1
    <<: *log
    hostname: mail.voen.teriahost.ru
    environment:
      MADDY_HOSTNAME: mail.voen.teriahost.ru
      MADDY_DOMAIN: voen.teriahost.ru
    volumes:
      - maddy_data:/data
      - maddy_certs:/data/tls
    ports:
      - "25:25"
    networks:
      default:
        aliases:
          - mail.voen.teriahost.ru
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 96m

  certsync:
    image: caddy:2-alpine
    <<: *log
    user: "0:0"
    entrypoint: ["/bin/sh", "/sync.sh"]
    volumes:
      - ./mail/sync-certs.sh:/sync.sh:ro
      - caddy_data:/caddy:ro
      - maddy_certs:/certs
    depends_on:
      - caddy
    restart: unless-stopped
    mem_limit: 24m
    memswap_limit: 24m

  webmail:
    image: roundcube/roundcubemail:1.6.x-apache
    <<: *log
    environment:
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mail.voen.teriahost.ru
      ROUNDCUBEMAIL_SMTP_SERVER: tls://mail.voen.teriahost.ru
      ROUNDCUBEMAIL_SMTP_PORT: "587"
    volumes:
      - ./mail/roundcube/zz-local.inc.php:/var/roundcube/config/zz-local.inc.php:ro
      - webmail_db:/var/roundcube/db
    depends_on:
      - maddy
    expose:
      - "80"
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 192m

volumes:
  pgdata:
  keys:
  media:
  caddy_data:
  caddy_config:
  maddy_data:
  maddy_certs:
  webmail_db:
